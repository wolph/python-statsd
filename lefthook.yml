# Pre-commit hooks for python-statsd development
# Install: brew install lefthook && lefthook install
# Or: uv tool install lefthook && lefthook install

pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: '*.py'
      run: ruff check {staged_files}
    ruff-format:
      glob: '*.py'
      run: ruff format {staged_files}
      stage_fixed: true
    ty-check:
      run: uv run --extra tox tox -e ty
