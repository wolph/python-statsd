[tox]
requires =
    tox-uv>=1.0
    tox-gh-actions>=3.0
env_list = py{310,311,312,313,314}, pypy3, lint, mypy, basedpyright, pyrefly, docs
skip_missing_interpreters = true

# Keep this python mapping in sync with ci.yml's matrix: an unmapped version silently resolves to an empty envlist.
[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    pypy-3.11: pypy3

[testenv]
description = Run tests under {base_python}
deps = .[tests]
commands = pytest {posargs}

[testenv:lint]
description = Lint with ruff
skip_install = true
deps = ruff>=0.15.0
commands =
    ruff check statsd tests conftest.py
    ruff format --check statsd tests conftest.py

[testenv:mypy]
description = Type-check with mypy
deps =
    .
    mypy>=1.14
commands = mypy

[testenv:basedpyright]
description = Type-check with basedpyright
deps =
    .
    basedpyright>=1.0
commands = basedpyright

[testenv:pyrefly]
description = Type-check with pyrefly
deps =
    .
    pyrefly>=0.1
commands = pyrefly check

[testenv:ty]
description = Type-check with ty (run explicitly: tox -e ty)
deps =
    .
    ty
commands = ty check statsd

[testenv:docs]
description = Build Sphinx documentation
deps = .[docs]
changedir = docs
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html
