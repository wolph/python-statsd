[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "python-statsd"
version = "3.0.0"
description = "A statsd client: send counters, gauges and timers over UDP to statsd and on to Graphite."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rick van Hattem", email = "Wolph@wol.ph" }]
keywords = ["statsd", "graphite", "metrics", "udp"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/WoLpH/python-statsd/"
Documentation = "https://python-statsd.readthedocs.io/"
Changelog = "https://github.com/WoLpH/python-statsd/blob/master/CHANGELOG.md"
Funding = "https://github.com/sponsors/wolph"

[project.optional-dependencies]
docs = [
    "sphinx>=8.1.3",
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
]
tests = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.16.0",
]
dev = [
    "python-statsd[tests]",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "basedpyright>=1.39.10",
    "pyrefly>=1.2.0",
    "ty",
]
tox = [
    "tox>=4.61.2",
    "tox-uv>=1.36.0",
    "tox-gh-actions>=3.5.0",
]

[tool.uv.build-backend]
module-root = ""
module-name = "statsd"

[tool.pytest.ini_options]
testpaths = ["statsd", "tests"]
addopts = [
    "--doctest-modules",
    "--cov",
    "--cov-report=term-missing",
    "--no-cov-on-fail",
]

[tool.coverage.run]
source = ["statsd", "tests"]
branch = true

[tool.coverage.paths]
# Map the per-env and per-runner checkouts onto one set of paths so
# `coverage combine` merges them instead of reporting them separately.
source = ["statsd", "*/statsd", "*\\statsd"]
tests = ["tests", "*/tests", "*\\tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(typing\\.)?overload",
]

[tool.mypy]
packages = ["statsd"]
local_partial_types = true
strict = true
enable_error_code = [
    "exhaustive-match",
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[tool.pyright]
pythonPlatform = "All"
include = ["statsd"]
ignore = [".venv", ".tox", "pystatsd"]
typeCheckingMode = "strict"
reportPrivateUsage = false
reportUnusedParameter = false
reportUnusedVariable = false

[tool.pyrefly]
project-includes = ["statsd"]

[tool.ty.src]
include = ["statsd"]

[tool.uv]
exclude-newer = "14 days"
