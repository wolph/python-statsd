[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[project]
name = "python-statsd"
version = "3.0.0"
description = "statsd is a client for Etsy's node-js statsd server. A proxy for the Graphite stats collection and graphing server."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rick van Hattem", email = "Wolph@wol.ph" }]
keywords = ["statsd", "graphite", "metrics", "udp"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/WoLpH/python-statsd/"
Documentation = "https://python-statsd.readthedocs.io/"
Changelog = "https://github.com/WoLpH/python-statsd/blob/master/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "sphinx>=8.0",
    "furo>=2025.1",
]
tests = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "coverage>=7.0",
]
dev = [
    "python-statsd[tests]",
    "ruff>=0.15.0",
    "mypy>=1.14",
    "basedpyright>=1.0",
    "pyrefly>=0.1",
    "ty",
]
tox = [
    "tox>=4.0",
    "tox-uv>=1.0",
    "tox-gh-actions>=3.0",
]

[tool.uv.build-backend]
module-root = ""
module-name = "statsd"

[tool.pytest.ini_options]
testpaths = ["statsd", "tests"]
addopts = [
    "--doctest-modules",
    "--cov",
    "--cov-report=term-missing",
    "--no-cov-on-fail",
]

[tool.coverage.run]
source = ["statsd", "tests"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(typing\\.)?overload",
]

[tool.mypy]
packages = ["statsd"]
local_partial_types = true
strict = true
enable_error_code = [
    "exhaustive-match",
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[tool.pyright]
pythonPlatform = "All"
include = ["statsd"]
ignore = [".venv", ".tox", "pystatsd"]
typeCheckingMode = "strict"
reportPrivateUsage = false
reportUnusedParameter = false
reportUnusedVariable = false

[tool.pyrefly]
project-includes = ["statsd"]

[tool.ty.src]
include = ["statsd"]
