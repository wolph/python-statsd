version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-dev-dependencies:
        patterns: ['*']
