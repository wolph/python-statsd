version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-dev-dependencies:
        patterns: ['*']
